name: Copie des données des graphiques
on:
  schedule:
    - cron: '17 14 * * 6'   # samedi vers 9 h 17 (heure de Toronto)
  workflow_dispatch:
permissions:
  contents: write
concurrency: copie-live
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: FRED (économie et taux)
        run: node tools/run_snap.mjs tools/snap_fred.js https://fred.stlouisfed.org/ out fred_out.json
      - name: CFTC (COT)
        run: node tools/run_snap.mjs tools/snap_cot.js https://publicreporting.cftc.gov/ '{cot}' cot_out.json
      - name: Mise à jour de data.json
        run: |
          git config user.name "scorecard-bot"
          git config user.email "scorecard-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase -q origin main
            python3 tools/apply_live.py fred_out.json cot_out.json
            git add data.json
            git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
            git commit -q -m "Copie des données des graphiques du $(date -u +%F)"
            git push -q origin main && exit 0
            git reset -q --hard origin/main
            sleep 10
          done
          exit 1
